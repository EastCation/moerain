<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萌雨社倒计时装置</title>
    <link rel="stylesheet" href="statics/starindex/css/countdown.css">
</head>
<body>
    <div class="background"></div>
    <div class="countdown-container">
        <h1>欸嘿~</h1>
        <div id="countdown">
            <div>
                <span id="days"></span>
                <div>天</div>
            </div>
            <div>
                <span id="hours"></span>
                <div>小时</div>
            </div>
            <div>
                <span id="minutes"></span>
                <div>分钟</div>
            </div>
            <div>
                <span id="seconds"></span>
                <div>秒</div>
            </div>
            <div>
            <div class="music-control">
                <span id="play-pause">喵~</span>
            </div>
            </div>
        </div>
    </div>
    <audio id="background-music" autoplay loop>
        <source src="https://files.moerain.cn/f/27Sw/%E6%B3%A0%E9%B8%A2yousa%20-%20%E5%8B%BE%E6%8C%87%E8%B5%B7%E8%AA%93.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <script src="statics/starindex/js/countdown.js"></script>
</body>
</html>
